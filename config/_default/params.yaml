hugoblox:
  schema: "2.0"

  identity:
    name: "OPL (Orbital Propulsion Lab.)"
    type: organization
    tagline: "Assistant Professor | Orbital Propulsion Laboratory | Kyungil University"
    description: "Orbital Propulsion Laboratory (OPL / 궤도추진연구실) at Kyungil University, Korea. Research in liquid rocket propulsion, satellite propulsion systems, and hypergolic propellants."
    social:
      twitter: ""

  theme:
    mode: system
    pack: "default"
    colors:
      primary: ""
      secondary: ""
      neutral: ""
    colors_light: {}
    colors_dark: {}
    surfaces:
      background: ""
      foreground: ""
      header:
        background: ""
        foreground: ""
      footer:
        background: ""
        foreground: ""

  typography:
    pack: "modern"
    families:
      heading: "IBM Plex Sans"
      body: "IBM Plex Sans"
      nav: "IBM Plex Sans"
      code: ""

  layout:
    radius: "md"
    spacing: "spacious"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    show_title: false
    align: center
    search: true
    theme_toggle: true
    theme_picker: true
    language_switcher: true
    cta:
      enable: false
      text: ""
      url: ""

  footer:
    style: minimal
    language_switcher: true
    text: ""

  copyright:
    notice: "© {year} {name}. This work is licensed under {license}"
    license:
      type: cc
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

  seo:
    title: ""
    location:
      address:
        street: "50, Gamasil-gil"
        city: "Hayang-eup, Gyeongsan-si"
        region: "Gyeongsangbuk-do"
        postal_code: "38428"
        country: "Republic of Korea"
      coordinates:
        latitude: 35.9196
        longitude: 128.8215
      phone: ""
    ai:
      allow:
        - /
      disallow: []
      note: "Guidance for AI crawlers - customize to match your public content."
      contact: ""

  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
    citations:
      style: apa

  search:
    enable: true
    suggestions: []
    quick_actions: []

  comments:
    enable: false
    provider: ""
    giscus:
      repo: ""
      repo_id: ""
      category: ""
      category_id: ""
    disqus:
      shortname: ""

  analytics:
    google:
      measurement_id: ""
    google_tag_manager:
      container_id: ""
    plausible:
      domain: ""
    fathom:
      site_id: ""
    pirsch:
      site_id: ""
    clarity:
      project_id: ""
    baidu:
      site_id: ""

  verification:
    google: ""
    bing: ""
    baidu: ""
    yandex: ""
    pinterest: ""
    naver: ""

  repository:
    enable: false
    url: ""
    branch: main
    content_dir: content

  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us

  security:
    csp:
      policy: ""
      report_only: false
    frame_options: allow
    permissions_policy: ""

  privacy:
    enable: false
    anonymize_analytics: true

  debug:
    enable: false
    hud:
      position: bottom-left
      opacity: 1.0
    export_logs: true

  pro:
    hide_attribution: false
    affiliate_code: ""
