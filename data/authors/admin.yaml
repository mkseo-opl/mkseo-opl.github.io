bio: |
  Minkyo Seo (서민교) is an Assistant Professor in the Department of Mechanical Engineering at Kyungil University (경일대학교), where he leads the **Orbital Propulsion Laboratory (OPL, 궤도추진연구실)**. Prior to joining academia, he served as a Senior Researcher at Hanwha Aerospace for approximately 13 years, developing both solid and liquid propulsion systems for the aerospace and defense sectors.

  During the development of Korea's first lunar orbiter (Danuri) propulsion system and the country's first storable bi-propellant thruster, he played a key role in international cooperation with ArianeGroup, including co-development and technology transfer of major components. He also pursued a PhD at KAIST, researching triglyme-based low-toxicity hypergolic propellants as a green alternative to toxic MMH/NTO systems.

  OPL was established to advance Korea's capabilities in space and defense propulsion, with a particular focus on the development and testing of liquid bipropellant and monopropellant systems.

