bio: |
  Minkyo Seo (서민교) is an Assistant Professor in the Department of Mechanical Engineering at Kyungil University (경일대학교), where he leads the **Orbital Propulsion Laboratory (OPL, 궤도추진연구실)**. His research focuses on liquid rocket propulsion, satellite propulsion systems, and low-toxicity alternative propellants.

  OPL was established to advance Korea's capabilities in space and defense propulsion, with a particular focus on the development and testing of liquid bipropellant and monopropellant systems.

